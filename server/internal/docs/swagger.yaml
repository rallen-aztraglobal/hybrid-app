      summary: 修改应用商店（仅 name/sort/status；code 不可改）
      tags:
      - stores
  /healthz:
    get:
      description: 返回约定 JSON {"ok":true,"brand":"ap","v":1}。带 ?brand= 时回显品牌，供按品牌校验。
      parameters:
      - description: 品牌 code（回显，便于 APK 校验 brand 匹配）
        in: query
        name: brand
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.healthzResp'
      summary: 业务健康端点（供 APK 探针校验是我们站点）
      tags:
      - app
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
