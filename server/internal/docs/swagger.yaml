basePath: /
definitions:
  github_com_hybrid-app_server_internal_domainutil.DomainInput:
    properties:
      enabled:
        type: boolean
      position:
        type: integer
      url:
        type: string
    type: object
  github_com_hybrid-app_server_internal_httpx.Envelope:
    properties:
      code:
        description: 0 = 成功，非 0 = 业务错误码（沿用 HTTP 状态码语义）
        type: integer
      data:
        description: 业务数据
      message:
        description: 人类可读信息
        type: string
    type: object
  github_com_hybrid-app_server_internal_model.AdjustEvents:
    additionalProperties:
      type: string
    type: object
  github_com_hybrid-app_server_internal_service.AddBuildArtifactInput:
    properties:
      apkUrl:
        type: string
      flavor:
        type: string
      size:
        type: integer
      versionName:
        type: string
    required:
    - apkUrl
    - flavor
    type: object
  github_com_hybrid-app_server_internal_service.AppConfig:
    properties:
      appId:
        description: = applicationId（解析键）
        type: string
      configVersion:
        description: 渠道 updated_at 时间戳，单调递增便于客户端判新
        type: integer
      domains:
        description: '[主, 备用1..3]，按 position 升序'
        items:
          type: string
        type: array
      palcode:
        description: 渠道 PAL_CODE（回显，APK 拼 /?palcode= 用，可跨品牌重复）
        type: string
      probePath:
        description: APK 探测「确实是我们站点」用（ADR-0003）
        type: string
      ttlSeconds:
        description: 建议缓存秒数
        type: integer
    type: object
  github_com_hybrid-app_server_internal_service.BuildLogSegment:
    properties:
      done:
        description: 构建是否已进入终态（前端据此停止轮询）
        type: boolean
      log:
        description: '[offset, next) 区间的日志'
        type: string
      next:
        description: 下次请求应传的 offset
        type: integer
      offset:
        description: 本段起始字节偏移
        type: integer
    type: object
  github_com_hybrid-app_server_internal_service.BuildManifest:
    properties:
      brand:
        type: string
      brandDomains:
        description: 品牌默认域名（继承用）
        items:
          type: string
        type: array
      channels:
        items:
          $ref: '#/definitions/github_com_hybrid-app_server_internal_service.ManifestChannel'
        type: array
      configBaseUrl:
        description: CDN 配置端点前缀（烧录进 bootstrap.json）
        type: string
      generatedAt:
        type: string
      hmsEnabled:
        type: boolean
      scheme:
        type: string
    type: object
  github_com_hybrid-app_server_internal_service.CreateBuildJobInput:
    properties:
      brand:
        type: string
      flavors:
        items:
          type: string
        type: array
      name:
        description: 可空，默认 <brand>-<versionName>-<YYYYMMDD-HHmm>
        type: string
      testEvents:
        type: boolean
      versionName:
        type: string
    required:
    - brand
    - flavors
    - versionName
    type: object
  github_com_hybrid-app_server_internal_service.CreateChannelInput:
    properties:
      adjustAppToken:
        type: string
      adjustEvents:
        additionalProperties:
          type: string
        type: object
      appName:
        type: string
      brandCode:
        type: string
      flavorName:
        type: string
      palCode:
        type: string
      remark:
        type: string
      storeId:
        type: integer
    required:
    - appName
    - brandCode
    - flavorName
    - palCode
    type: object
  github_com_hybrid-app_server_internal_service.CreateStoreInput:
    properties:
      code:
        type: string
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - name
    type: object
  github_com_hybrid-app_server_internal_service.GateResponse:
    properties:
      mode:
        description: '"A" | "B"'
        type: string
      openMode:
        description: 仅 mode=B 时有值："internal"（内开）| "external"（外开）
        type: string
      url:
        description: 仅 mode=B 时有值：B 面完整地址（主域名 + /?palcode=，客户端原样打开）
        type: string
    type: object
  github_com_hybrid-app_server_internal_service.ManifestChannel:
    properties:
      adjustAppToken:
        type: string
      adjustEvents:
        additionalProperties:
          type: string
        type: object
      appName:
        type: string
      applicationId:
        type: string
      configSnapshotUrl:
        description: 该渠道的 CDN 配置快照地址
        type: string
      effectiveDomains:
        description: 合并继承后的域名（写 bootstrap.json 兜底）
        items:
          type: string
        type: array
      flavorName:
        type: string
      palCode:
        type: string
      resZipUrl:
        description: 资源 zip 地址（CLI 下载解压到 flavor 目录）
        type: string
      splashUrl:
        type: string
      status:
        type: string
    type: object
  github_com_hybrid-app_server_internal_service.PushCampaignInput:
    properties:
      body:
        type: string
      deeplinkPath:
        type: string
      extraData:
        additionalProperties:
          type: string
        type: object
      imageUrl:
        type: string
      name:
        type: string
      targetAppIds:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  github_com_hybrid-app_server_internal_service.ReportBuildStatusInput:
    properties:
      logExcerpt:
        description: 可选：末段日志摘要，列表展示用
        type: string
      status:
        type: string
    required:
    - status
    type: object
  github_com_hybrid-app_server_internal_service.UpdateChannelInput:
    properties:
      adjustAppToken:
        type: string
      adjustEvents:
        additionalProperties:
          type: string
        type: object
      appName:
        type: string
      flavorName:
        type: string
      palCode:
        type: string
      remark:
        type: string
      status:
        type: string
    type: object
  github_com_hybrid-app_server_internal_service.UpdateStoreInput:
    properties:
      name:
        type: string
      sort:
        type: integer
      status:
        type: string
    type: object
  internal_handler.claimReq:
    properties:
      runner:
        type: string
    type: object
  internal_handler.createListingCampaignReq:
    properties:
      body:
        type: string
      deeplinkPath:
        type: string
      extraData:
        additionalProperties:
          type: string
        type: object
      imageUrl:
        type: string
      listingIds:
        items:
          type: integer
        type: array
      name:
        type: string
      title:
        type: string
    type: object
  internal_handler.createListingReq:
    properties:
      adjustAppToken:
        type: string
      adjustEvents:
        $ref: '#/definitions/github_com_hybrid-app_server_internal_model.AdjustEvents'
      afAppId:
        type: string
      afDevKey:
        type: string
      brandCode:
        type: string
      bundleId:
        type: string
      displayName:
        type: string
      name:
        type: string
      openMode:
        type: string
      palCode:
        type: string
      platform:
        type: string
      remark:
        type: string
      storeUrl:
        type: string
    type: object
  internal_handler.currentVersionResp:
    properties:
      versionName:
        type: string
    type: object
  internal_handler.gateReq:
    properties:
      bundleId:
        type: string
      platform:
        type: string
      timezone:
        type: string
    type: object
  internal_handler.healthzResp:
    properties:
      brand:
        type: string
      ok:
        type: boolean
      v:
        type: integer
    type: object
  internal_handler.loginReq:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal_handler.refreshReq:
    properties:
      refreshToken:
        type: string
    type: object
  internal_handler.registerListingTokenReq:
    properties:
      bundleId:
        type: string
      deviceToken:
        type: string
      gateMode:
        description: 客户端上报的最近 AB 面判定结果 A/B（决定是否进 B 面推送受众）
        type: string
      model:
        type: string
      platform:
        type: string
    type: object
  internal_handler.registerTokenReq:
    properties:
      appId:
        type: string
      model:
        type: string
      palcode:
        type: string
      platform:
        type: string
      token:
        type: string
    type: object
  internal_handler.scheduleCampaignReq:
    properties:
      scheduledAt:
        description: ISO8601
        type: string
    type: object
  internal_handler.sendCampaignReq:
    properties:
      dryRun:
        type: boolean
    type: object
  internal_handler.setChannelDomainsReq:
    properties:
      domains:
        items:
          $ref: '#/definitions/github_com_hybrid-app_server_internal_domainutil.DomainInput'
        type: array
      inheritBrand:
        type: boolean
    type: object
  internal_handler.setDomainsReq:
    properties:
      domains:
        items:
          $ref: '#/definitions/github_com_hybrid-app_server_internal_domainutil.DomainInput'
        type: array
    type: object
  internal_handler.setListingDomainsReq:
    properties:
      domains:
        items:
          $ref: '#/definitions/github_com_hybrid-app_server_internal_domainutil.DomainInput'
        type: array
      inheritBrand:
        type: boolean
    type: object
  internal_handler.setListingGateReq:
    properties:
      countries:
        items:
          type: string
        type: array
      ipAllowCidrs:
        items:
          type: string
        type: array
      ipDenyCidrs:
        items:
          type: string
        type: array
      timezoneDeny:
        items:
          type: string
        type: array
    type: object
  internal_handler.testListingGateReq:
    properties:
      ip:
        type: string
      timezone:
        type: string
    type: object
  internal_handler.tokenResp:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  internal_handler.updateListingReq:
    properties:
      adjustAppToken:
        type: string
      adjustEvents:
        $ref: '#/definitions/github_com_hybrid-app_server_internal_model.AdjustEvents'
      afAppId:
        type: string
      afDevKey:
        type: string
      brandCode:
        type: string
      displayName:
        type: string
      gateEnabled:
        type: boolean
      name:
        type: string
      openMode:
        type: string
      palCode:
        type: string
      remark:
        type: string
      status:
        type: string
      storeUrl:
        type: string
    type: object
info:
  contact: {}
  description: hybrid-app 多渠道打包后台：渠道 CRUD / 图标管线 / 域名配置 / 运行时下发。
  title: 渠道中台 API
  version: "1.0"
paths:
  /api/app/config:
    get:
      description: APK 启动用不变的 applicationId（BuildConfig.APPLICATION_ID）拉最新域名（ADR-0002/0009）。可被
        CDN 强缓存；后台域名变更后刷新快照。
      parameters:
      - description: 渠道 applicationId（解析键）
        in: query
        name: appId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_service.AppConfig'
      summary: 运行时配置（APK 公开消费，强缓存）— 返回该渠道最新域名清单 + 探测端点
      tags:
      - app
  /api/app/google-services:
    get:
      description: 返回该品牌合并的 google-services.json 原始 JSON 字节（非 Envelope）。未上传则 404；CLI
        据此判断「未配置 FCM 跳过」。
      parameters:
      - description: 品牌 code：ap | bp | gp
        in: query
        name: brand
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 原始 JSON 内容
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      summary: 下载品牌 google-services.json（公开端点，非机密，CLI/构建机消费）
      tags:
      - app
  /api/app/listing/gate:
    post:
      consumes:
      - application/json
      description: |-
        服务端按请求真实 IP 查国家 + 校验时区/IP 规则，返回 mode=A（展示应用内容）或 mode=B（放行到配置 URL）。
        mode=B 时额外带 openMode（internal=内开/external=外开），告诉客户端用哪种方式打开该 URL；mode=A 时不含该字段。
        出于安全：不返回任何判定原因/国家/命中规则，审核方也无法从响应反推规则。
      parameters:
      - description: platform/bundleId/timezone
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.gateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_service.GateResponse'
      summary: AB 面判定（公开，客户端 App 启动调用，不缓存）
      tags:
      - app
  /api/app/listing/register-token:
    post:
      consumes:
      - application/json
      description: 客户端拿到 gate 判定后注册 FCM/APNs token 并上报 gateMode；上架包推送强制只发 B 面设备。
      parameters:
      - description: platform/bundleId/deviceToken/gateMode
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.registerListingTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      summary: 上架包设备 push token 注册（公开，带 AB 面判定结果）
      tags:
      - app
  /api/app/push/register-token:
    post:
      consumes:
      - application/json
      parameters:
      - description: token 注册请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.registerTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      summary: APK 上报 FCM 设备 token（公开端点）
      tags:
      - push
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.tokenResp'
              type: object
      summary: 账号密码登录
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.tokenResp'
              type: object
      summary: 刷新 access token
      tags:
      - auth
  /api/brands:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 大渠道列表（含渠道计数、accent 色、默认域名）
      tags:
      - brands
  /api/brands/{code}/domains:
    get:
      parameters:
      - description: 品牌 code (ap/bp/gp)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 品牌默认域名清单
      tags:
      - brands
    put:
      consumes:
      - application/json
      parameters:
      - description: 品牌 code
        in: path
        name: code
        required: true
        type: string
      - description: 域名清单
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.setDomainsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 更新品牌默认域名（主+最多3备用，强校验）
      tags:
      - brands
  /api/build/claim:
    post:
      consumes:
      - application/json
      parameters:
      - description: runner 标识
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_handler.claimReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: runner 领取下一条 queued 任务（原子；无任务返回 data:null）
      tags:
      - build
  /api/build/current-version:
    get:
      parameters:
      - description: 品牌 code
        in: query
        name: brand
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.currentVersionResp'
              type: object
      security:
      - BearerAuth: []
      summary: 与 CreateBuildJob 的版本校验共用同一实现，二者结果保证一致）
      tags:
      - build
  /api/build/jobs:
    post:
      consumes:
      - application/json
      parameters:
      - description: brand/flavors/versionName(X.Y.Z)/testEvents/name?
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_hybrid-app_server_internal_service.CreateBuildJobInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 入队一个构建任务（Web 打包中心触发；状态机 queued→running→success/failed）
      tags:
      - build
  /api/build/manifest:
    get:
      parameters:
      - description: 品牌 code
        in: query
        name: brand
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_hybrid-app_server_internal_service.BuildManifest'
              type: object
      security:
      - BearerAuth: []
      summary: 一次拉全：某品牌启用渠道 + 域名 + palcode + 资源 zip 地址（CLI 据此重写 CSV/res）
      tags:
      - build
  /api/build/records:
    get:
      parameters:
      - description: 品牌 code
        in: query
        name: brand
        type: string
      - description: 状态 queued/running/success/failed
        in: query
        name: status
        type: string
      - description: 条数，默认 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 构建记录列表（按品牌/状态筛选）
      tags:
      - build
  /api/build/records/{id}:
    get:
      parameters:
      - description: 构建记录 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 单条构建记录（含全部 APK 产物，供「构建记录页」列出下载）
      tags:
      - build
  /api/build/records/{id}/artifacts:
    post:
      consumes:
      - application/json
      parameters:
      - description: 构建记录 ID
        in: path
        name: id
        required: true
        type: integer
      - description: flavor/versionName/apkUrl/size
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_hybrid-app_server_internal_service.AddBuildArtifactInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: runner 上报一个产出的 APK（落 build_artifact，并汇总进记录）
      tags:
      - build
  /api/build/records/{id}/logs:
    get:
      parameters:
      - description: 构建记录 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 起始字节偏移，默认 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_hybrid-app_server_internal_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_hybrid-app_server_internal_service.BuildLogSegment'
              type: object
      security:
      - BearerAuth: []
