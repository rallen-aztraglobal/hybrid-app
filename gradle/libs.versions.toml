[versions]
afAndroidSdk = "6.17.0"
afOaid = "6.12.3"
hmsAdsIdentifier = "3.4.62.300"
agp = "8.12.0-alpha01"
fragmentKtx = "1.8.9"
playServicesAdsIdentifierVersion = "18.2.0"
playServicesAppset = "16.1.0"
webviewInterceptor = "1.0.12"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2024.09.00"
filamentAndroid = "1.17.1"
# 域名容灾：协程 + 网络（OkHttp）
kotlinxCoroutines = "1.8.1"
okhttp = "4.12.0"
lifecycleRuntimeCompose = "2.6.1"
# 单测：Robolectric 提供真实 org.json / android.util.Log（纯 JVM 跑 DomainResolver 单测）
robolectric = "4.16.1"
# Firebase 推送（FCM）
firebaseBom = "33.7.0"
googleServices = "4.4.2"

[libraries]
af-android-sdk = { module = "com.appsflyer:af-android-sdk", version.ref = "afAndroidSdk" }
af-oaid = { module = "com.appsflyer:oaid", version.ref = "afOaid" }
hms-ads-identifier = { module = "com.huawei.hms:ads-identifier", version.ref = "hmsAdsIdentifier" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
gms-play-services-ads-identifier = { module = "com.google.android.gms:play-services-ads-identifier", version.ref = "playServicesAdsIdentifierVersion" }
play-services-appset = { module = "com.google.android.gms:play-services-appset", version.ref = "playServicesAppset" }
webview-interceptor = { module = "com.github.acsbendi:Android-Request-Inspector-WebView", version.ref = "webviewInterceptor" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
filament-android = { group = "com.google.ar.sceneform", name = "filament-android", version.ref = "filamentAndroid" }
# 域名容灾：协程 + 网络（OkHttp）
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Firebase 推送：BOM 控制全套 Firebase 版本；messaging 是接收推送的核心库。
# 使用非 -ktx 变体避免引入 kotlinx-coroutines-play-services 这一额外传递依赖（与项目既有协程版本隔离更干净）。
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# google-services 插件：解析 google-services.json → 注入 Firebase 项目 ID；apply false 表示不在根项目中应用
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

