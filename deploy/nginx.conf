# ============================================================================
# deploy/nginx.conf —— 单服务器自托管反向代理（ADR-0007/0008）
#
#   /        → React 静态站点（web/dist，挂载到 /usr/share/nginx/html）
#   /api     → go-api 内部 :8090（后端 Echo）
#   /apks/   → 构建产物卷（与 build-runner / go-api 共享，只读、可下载）
#   /swagger → 透传后端 OpenAPI UI（前端生成 TS 客户端用）
#   /static  → 透传后端本地对象存储（STORAGE_KIND=local 时的 PublicURL 前缀）
#
# TLS 由外层（云 LB / Caddy / 手工证书）终结即可；本文件只做单机 80 反代起步。
# ============================================================================

upstream go_api {
    server go-api:8090;
    keepalive 32;
}

# 上游 APK 文件可能较大：放开 gzip 对二进制无益，统一在 location 里控制。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 安全/体积基线。
    server_tokens off;
    client_max_body_size 32m;          # 图标主图(1024²)/资源上传足够；APK 不经此上传。
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- API 反代到后端 :8090 ----
    location /api/ {
        proxy_pass         http://go_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;          # 打包触发等接口可能稍慢。
    }

    # 后端健康端点（APK 容灾探针校验「确实是我们站点」，ADR-0003）。
    location = /healthz {
        proxy_pass         http://go_api;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # OpenAPI UI / spec（供前端生成客户端）。
    location /swagger/ {
        proxy_pass         http://go_api;
        proxy_set_header   Host $host;
    }

    # 后端本地对象存储（图标/资源 zip），STORAGE_KIND=local 时启用。
    location /static/ {
        proxy_pass         http://go_api;
        proxy_set_header   Host $host;
    }

    # ---- 构建产物下载：/apks/<brand>/<flavor>/<versionName>/app-*.apk ----
    # 直接由 nginx 从共享产物卷出静态文件（ADR-0008：APK 不走 MinIO/CDN）。
    location /apks/ {
        alias /srv/apks/;
        autoindex off;                    # 不暴露目录列表；下载靠 build_record.apk_urls。
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
    }

    # ---- React 静态站点 + 前端路由回退 ----
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;   # SPA：未命中文件回退到 index.html。
    }

    # 带 hash 的静态资源长缓存。
    location /assets/ {
        root      /usr/share/nginx/html;
        access_log off;
        expires   30d;
        add_header Cache-Control "public, immutable";
    }
}
