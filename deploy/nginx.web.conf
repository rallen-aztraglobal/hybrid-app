# ============================================================================
# deploy/nginx.web.conf —— 服务 B 内部「web」服务：只出 React 静态 dist
#
# 仅承载 SPA 文件，监听内网 :80。对外 TLS、/api 反代、/apks 下载由前置
# nginx（deploy/nginx.console.conf.template）处理；本文件不含这些 location。
# 烧进 Dockerfile.web 的 web-dist 阶段。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源长缓存。
    location /assets/ {
        root      /usr/share/nginx/html;
        access_log off;
        expires   30d;
        add_header Cache-Control "public, immutable";
    }

    # React 静态站点 + 前端路由回退。
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;   # SPA：未命中文件回退到 index.html。
    }
}
