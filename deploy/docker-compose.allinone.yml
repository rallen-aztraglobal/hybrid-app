# ============================================================================
# deploy/docker-compose.allinone.yml —— 单机合并部署（A+B 同机，一台 4C8G）
#   决策：用户选「A+B 合并单机部署」。相比拆成两套，本方案：
#     - 免去 API_BASE_URL 注入：build-runner 与 nginx /api 都指向【内网 go-api:8090】（固定）。
#     - 一个对外 nginx 同时出：Console UI(/)、API(/api,/static,/healthz)、APK 下载(/apks/)。
#     - RUNNER_TOKEN 一份，go-api 与 build-runner 共用，单机天然一致。
#   工具链/红线同两套版：keystore 只内置 build-runner 镜像；运维只 pull+up（ADR-0008/0010）。
#
# 当前对外【HTTP/IP】（暂无域名、无证书，仅 80）。拿到域名后启用 TLS：见 docs/admin/05。
#
# 自测（只校验语法）：docker compose -f deploy/docker-compose.allinone.yml config -q
# 配置来自同目录 .env（拷 .env.allinone.example 改）。
# ============================================================================

name: hybrid

services:
  # -------------------------------------------------------------------------
  # mysql：元数据库
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hybrid_admin}"
      MYSQL_USER: "${MYSQL_USER:-hybrid}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me-app}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hybrid]

  # -------------------------------------------------------------------------
  # go-api：后端（内网 :8090；首启自动 seed 80 渠道 + 资源，ADR-0011）
  # -------------------------------------------------------------------------
  go-api:
    image: registry.example.com/hybrid/go-api:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      SERVER_ADDR: ":8090"
      CORS_ALLOW_ORIGIN: ""            # 同源反代（同一 nginx），留空即可。
      DB_DRIVER: "mysql"
      DB_DSN: "${MYSQL_USER:-hybrid}:${MYSQL_PASSWORD:-hybrid}@tcp(mysql:3306)/${MYSQL_DATABASE:-hybrid_admin}?charset=utf8mb4&parseTime=True&loc=Local"
      DB_AUTOMIGRATE: "${DB_AUTOMIGRATE:-true}"
      DB_AUTOSEED: "${DB_AUTOSEED:-true}"
      SEED_DIR: "${SEED_DIR:-/app/seed}"
      STORAGE_KIND: "local"
      STORAGE_LOCAL_DIR: "/data/objects"
      STORAGE_PUBLIC_URL: "${STORAGE_PUBLIC_URL:-/static}"
      JWT_SECRET: "${JWT_SECRET:-}"      # 留空 → 首启随机生成（重启失效；要稳定就填）。
      JWT_ISSUER: "${JWT_ISSUER:-hybrid-admin}"
      BOOTSTRAP_ADMIN: "${BOOTSTRAP_ADMIN:-admin:admin12345}"
      # 构建机长期静态令牌（ADR-0008/S1）：与下方 build-runner 共用同一个值。
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
      APP_PROBE_PATH: "${APP_PROBE_PATH:-/healthz}"
      APP_CONFIG_TTL_SECONDS: "${APP_CONFIG_TTL_SECONDS:-600}"
      # APK 运行时配置端点基址（烧进 bootstrap.json 的 configUrl；改域名不重打包的关键）。
      # 形如 https://api.<域名>/api/app/config；留空则 APK 只用编译期兜底域名、不热更。
      APP_CONFIG_BASE_URL: "${APP_CONFIG_BASE_URL:-}"
      DOMAIN_PROBE_ENABLE: "${DOMAIN_PROBE_ENABLE:-true}"
      # ---- 推送（FCM HTTP v1）----
      # 总开关默认开；缺私钥时后端门控自动 no-op（campaign 留 draft），开着也安全。
      PUSH_ENABLED: "${PUSH_ENABLED:-true}"
      PUSH_CRON_ENABLE: "${PUSH_CRON_ENABLE:-true}"
      # service account 私钥（机密）：经下方 ./google-services 只读挂载进 /secrets。
      # 私钥本身不写在此（compose 入 git），仅引用容器内路径；缺文件→该品牌跳过不发。
      FIREBASE_SA_AP: "/secrets/hybrid-ap-firebase-adminsdk-fbsvc-d321c8a645.json"
      FIREBASE_SA_BP: "/secrets/hybrid-bp-firebase-adminsdk-fbsvc-8d90186afa.json"
      FIREBASE_SA_GP: "/secrets/hybrid-gp-firebase-adminsdk-fbsvc-4ceaedae3f.json"
      # FIREBASE_SA_GP2 留空：gp 溢出项目暂无私钥，溢出包自动跳过（Skipped，不算失败）。
      # 上架包（ColorStack=Android / DeckTallyPro=iOS）独立 Firebase 项目 hybrid-listings-51660。
      # 私钥 adminsdk JSON 已放 ./google-services（*firebase-adminsdk* 被 .gitignore 拦，不入库）。
      FIREBASE_SA_LISTINGS: "/secrets/hybrid-listings-51660-firebase-adminsdk-fbsvc-a684a0cbae.json"
      FIREBASE_PROJECT_AP: "hybrid-ap"
      FIREBASE_PROJECT_BP: "hybrid-bp"
      FIREBASE_PROJECT_GP: "hybrid-gp"
      FIREBASE_PROJECT_LISTINGS: "${FIREBASE_PROJECT_LISTINGS:-hybrid-listings-51660}"
    volumes:
      - api-data:/data
      # 私钥只读挂载：rsync 已把 deploy/google-services 同步上服务器，compose 在 deploy/ 下执行，
      # 相对路径正好命中。文件 644 → 容器 nonroot(uid 65532) 可读。
      - ./google-services:/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [hybrid]

  # -------------------------------------------------------------------------
  # build-runner：服务器端打包机（keystore 已内置镜像）
  #   合并部署关键：HYBRID_SERVER_URL 固定内网 go-api:8090，无需任何后端地址配置。
  # -------------------------------------------------------------------------
  build-runner:
    image: registry.example.com/hybrid/build-runner:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.builder
    restart: unless-stopped
    environment:
      HYBRID_SERVER_URL: "http://go-api:8090"      # ← 固定内网；合并部署免 API_BASE_URL。
      HYBRID_RUNNER_TOKEN: "${RUNNER_TOKEN:-}"      # 与 go-api 的 RUNNER_TOKEN 同值。
      BUILDER_WORKSPACE: "/workspace"
      BUILDER_REPO_DIR: "/workspace/hybrid-app"
      BUILDER_REPO_URL: "${BUILDER_REPO_URL:-}"     # 留空=已把仓库挂进 repo 卷；否则填 git 地址。
      BUILDER_REPO_BRANCH: "${BUILDER_REPO_BRANCH:-}"
      APKS_DIR: "/apks"
    volumes:
      - repo:/workspace
      - apks:/apks
      # Gradle 缓存持久化（发行包 + 依赖缓存）：不挂卷的话每次发版重建容器都会清空，
      # 冷启动要重新从 services.gradle.org / dl.google.com 下载，网络一抖打包就失败。
      - gradle-cache:/home/builder/.gradle
    depends_on:
      go-api:
        condition: service_started
    networks: [hybrid]

  # -------------------------------------------------------------------------
  # web：React 静态 dist（内网 :80，前置 nginx 出站）
  # -------------------------------------------------------------------------
  web:
    image: registry.example.com/hybrid/web:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: web-dist
    restart: unless-stopped
    expose:
      - "80"
    networks: [hybrid]

  # -------------------------------------------------------------------------
  # nginx：唯一对外（当前 HTTP/IP，仅 80）
  # -------------------------------------------------------------------------
  nginx:
    image: registry.example.com/hybrid/nginx-allinone:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: nginx-allinone
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN to this box public IP, e.g. 47.80.75.106}"
    volumes:
      - apks:/srv/apks:ro              # APK 产物只读出下载（与 build-runner 共享）。
      # 启用 TLS 时再加：- ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - go-api
    networks: [hybrid]

volumes:
  mysql-data:
  api-data:
  apks:
  repo:
  gradle-cache:

networks:
  hybrid:
