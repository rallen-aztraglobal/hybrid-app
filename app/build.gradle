plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

def localProperties = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { stream -> localProperties.load(stream) }
}

// ============================================================================
// 大渠道（品牌）配置：所有小渠道按所属品牌共享 域名 / deeplink scheme / 策略。
//   - domain          首页加载域名
//   - scheme          deeplink scheme（写入 manifest 占位符 + BuildConfig）
//   - hms             是否集成 HMS / AppsFlyer OAID（仅 BP 需要）
// 小渠道清单（包名 / PAL_CODE / 应用名）在 channels/<brand>.csv 中，一行一个。
// 新增小渠道 = CSV 加一行 + 在 app/src/<flavor>/ 放置 icon 与 splash 资源。
// ============================================================================
def brandConfig = [
        ap: [domain: "https://arenaplus.ph", scheme: "gzone", hms: false],
        gp: [domain: "https://gzone.ph", scheme: "gzone", hms: false],
        bp: [domain: "https://www.bingoplus.com", scheme: "bingo", hms: true],
]

// 读取某品牌的小渠道清单 → [[name, applicationId, palCode, appName], ...]
def loadChannels = { String brand ->
    def csv = rootProject.file("channels/${brand}.csv")
    def rows = []
    if (!csv.exists()) return rows
    csv.eachLine { rawLine ->
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) return
        def p = line.split('\\|', -1)
        if (p.length < 4) return
        rows << [name: p[0].trim(), appId: p[1].trim(), pal: p[2].trim(), appName: p[3].trim(), brand: brand]
    }
    rows
}

def allChannels = brandConfig.keySet().collectMany { loadChannels(it) }

// 测试事件开关：打包时传 -PtestEvents=true 开启（默认关闭）。
def enableTestEvents = (project.findProperty("testEvents") ?: "false").toString().toBoolean()

// 版本号：打包时传 -PversionName=1.0.1（固定 X.Y.Z 格式）。
// versionCode 由 versionName「去掉点」换算（1.0.1 → 101）。
// 注意：为保证 versionCode 单调递增，各段建议保持个位数（0-9）。
def appVersionName = (project.findProperty("versionName") ?: "1.0.3").toString().trim()
if (!(appVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("versionName 必须为 X.Y.Z 格式（如 1.0.1），当前: '${appVersionName}'")
}
// versionCode 由 versionName「去掉点」换算（1.0.1 → 101）。为保证单调递增，各段必须个位数（0-9）：
// 多位会破坏顺序（1.0.10→1010 反超 1.1.0→110），故直接拒绝而非静默错排（评审 A3）。
if (appVersionName.tokenize('.').any { it.toInteger() > 9 }) {
    throw new GradleException("versionName 各段须为个位数 0-9（当前: '${appVersionName}'）；如需多位段请改用定宽 versionCode 方案")
}
def appVersionCode = appVersionName.replace(".", "").toInteger()

android {
    namespace 'com.hybrid.android'
    compileSdk 36

    defaultConfig {
        applicationId "com.hybrid.android"
        minSdk 29
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a' // 只支持这两个架构
        }
        // 所有渠道共用的配置
        buildConfigField "String", "AF_DEV_KEY", "\"fXoKsKQwxPCRdhD8CD8q6F\""
        buildConfigField "boolean", "ENABLE_TEST_EVENTS", "${enableTestEvents}"
    }

    flavorDimensions "channel"
    productFlavors {
        allChannels.each { ch ->
            def cfg = brandConfig[ch.brand]
            create(ch.name) {
                dimension "channel"
                applicationId ch.appId
                resValue "string", "app_name", ch.appName
                buildConfigField "String", "BRAND", "\"${ch.brand}\""
                buildConfigField "String", "DOMAIN", "\"${cfg.domain}\""
                buildConfigField "String", "DEEPLINK_SCHEME", "\"${cfg.scheme}\""
                buildConfigField "String", "PAL_CODE", "\"${ch.pal}\""
                manifestPlaceholders = [deeplinkScheme: cfg.scheme]
            }
        }
    }

    // 小渠道资源按大渠道分目录存放：src/channels/<brand>/<flavor>/res
    sourceSets {
        allChannels.each { ch ->
            getByName(ch.name) {
                res.srcDirs = ["src/channels/${ch.brand}/${ch.name}/res"]
            }
        }
    }

    // 仅当 local.properties 配齐 keystore 时才装配 release 签名；否则留空（评审 A4：
    // 避免 file(null) 在配置期 NPE，连带把 assembleDebug 也搞挂）。构建机镜像已烧入 local.properties。
    def keystoreFile = localProperties.get("KEYSTORE_FILE")?.toString()?.trim()
    def hasKeystore = keystoreFile != null && !keystoreFile.isEmpty()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword localProperties.get("KEYSTORE_PASSWORD")
                keyAlias localProperties.get("KEY_ALIAS")
                keyPassword localProperties.get("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("未配置 KEYSTORE_FILE：release 将不签名（仅适用于无密钥环境的冒烟编译）。")
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    // 单测在纯 JVM 跑：用 Robolectric 提供真实 org.json / android.util.Log（替代会抛异常的桩）。
    // includeAndroidResources 让 Robolectric 能加载合并后的资源/清单（DomainResolver 单测虽不读资源，
    // 但开启后 Robolectric 运行更稳，且为后续可能读 assets/资源的测试留好基建）。
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.fragment.ktx

    implementation libs.webview.interceptor
    implementation libs.af.android.sdk
    implementation libs.gms.play.services.ads.identifier
    implementation libs.play.services.appset
    implementation libs.filament.android

    // 域名容灾（DomainResolver）：协程做 STEP1 拉取 / STEP2 并发探测；OkHttp 做网络与证书校验
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.okhttp

    // HMS / AppsFlyer OAID：仅 BP 品牌渠道集成（按 flavor 维度注入依赖）
    allChannels.findAll { brandConfig[it.brand].hms }.each { ch ->
        add("${ch.name}Implementation", libs.af.oaid)
        add("${ch.name}Implementation", libs.hms.ads.identifier)
    }

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.okhttp.mockwebserver
    // Robolectric：在纯 JVM 单测中提供真实 org.json / android.util.Log 实现（解决桩 NPE / not-mocked）。
    testImplementation libs.robolectric
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

}
