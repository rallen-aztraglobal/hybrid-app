plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// ============================================================================
// 条件式 apply google-services 插件（feature gate，见 docs/admin/07-push.md §6b）：
//   - 有 google-services.json → apply 插件（插件会解析 json 并注入 Firebase 项目 ID/ResValue）。
//   - 无 google-services.json → 跳过 apply，构建照常进行，FCM 依赖仍加入但运行时探测后 no-op。
// 这样拿到账号后只需丢入 json + 重打包即可激活，零改码（ADR-0002 / ADR-0004）。
// 注意：必须在 plugins{} 块之外用 apply plugin: 写法，才能做运行时条件判断。
// ============================================================================
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"

    // FCM 按 flavor 自动开关（把上面的 feature gate 从「品牌粒度」细化到「flavor 粒度」）：
    //   - flavor 的 applicationId 在 google-services.json 里有对应 client → 正常处理，走 FCM。
    //   - 不在（如华为等商店包 com.xxx.yyy.hw、或尚未在 Firebase 注册的渠道）→ 禁用该 flavor 的
    //     processXxxGoogleServices 任务，构建照常，运行时 FirebaseApp 探测不到而 no-op。
    // 这样「配了就走 FCM、没配就跳过」，无需为每个商店/华为包白占 Firebase 每项目 30 App 名额。
    def gsConfiguredPackages = new groovy.json.JsonSlurper()
            .parse(file("google-services.json"))
            .client
            .collect { it.client_info.android_client_info.package_name }
            .toSet()
    android.applicationVariants.all { variant ->
        if (!gsConfiguredPackages.contains(variant.applicationId)) {
            def gsTaskName = "process${variant.name.capitalize()}GoogleServices"
            tasks.matching { it.name == gsTaskName }.configureEach { it.enabled = false }
        }
    }
}

// ============================================================================
// Adjust 按 flavor 自动开关（对齐上面 FCM 的 feature gate，见 docs/admin/08-adjust.md §4.2 / ADR-0013）：
//   adjust-tokens.json 里该 applicationId 有非空 appToken → 注入 BuildConfig，运行时真集成、发事件；
//   不在（未在 Console 绑定 Adjust）→ token 留空，运行时 AdjustBootstrap 探测为空后全程 no-op。
//   依赖恒在 classpath（同 firebase-messaging），仅靠 token 是否为空决定「集成/跳过」，零改码激活。
// 自包含旁路块，不动 loadChannels/productFlavors 一行（护栏 ADR-0004）。
// ============================================================================
if (file("adjust-tokens.json").exists()) {
    def adjustCfg = new groovy.json.JsonSlurper().parse(file("adjust-tokens.json"))
    android.applicationVariants.all { variant ->
        def entry = adjustCfg[variant.applicationId]
        if (entry?.appToken) {
            def events = groovy.json.JsonOutput.toJson(entry.events ?: [:])
                    .replace('\\', '\\\\').replace('"', '\\"')
            variant.buildConfigField "String", "ADJUST_APP_TOKEN", "\"${entry.appToken}\""
            variant.buildConfigField "String", "ADJUST_EVENT_MAP", "\"${events}\""
        }
    }
}

def localProperties = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { stream -> localProperties.load(stream) }
}

// ============================================================================
// 大渠道（品牌）配置：所有小渠道按所属品牌共享 域名 / deeplink scheme / 策略。
//   - domain          首页加载域名
//   - scheme          deeplink scheme（写入 manifest 占位符 + BuildConfig）
//   - hms             该品牌是否整体集成 HMS / AppsFlyer OAID（仅 BP）。注意这不是唯一开关：
//                     华为商店包（flavor 以 _hw 结尾）无论品牌都会注入，见下方 dependencies 块。
// 小渠道清单（包名 / PAL_CODE / 应用名）在 channels/<brand>.csv 中，一行一个。
// 新增小渠道 = CSV 加一行 + 在 app/src/<flavor>/ 放置 icon 与 splash 资源。
// ============================================================================
def brandConfig = [
        ap: [domain: "https://arenaplus.ph", scheme: "arenaplus", hms: false],
        gp: [domain: "https://gzone.ph", scheme: "gzone", hms: false],
        bp: [domain: "https://www.bingoplus.com", scheme: "bingo", hms: true],
]

// 读取某品牌的小渠道清单 → [[name, applicationId, palCode, appName], ...]
def loadChannels = { String brand ->
    def csv = rootProject.file("channels/${brand}.csv")
    def rows = []
    if (!csv.exists()) return rows
    csv.eachLine { rawLine ->
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) return
        def p = line.split('\\|', -1)
        if (p.length < 4) return
        rows << [name: p[0].trim(), appId: p[1].trim(), pal: p[2].trim(), appName: p[3].trim(), brand: brand]
    }
    rows
}

def allChannels = brandConfig.keySet().collectMany { loadChannels(it) }

// 测试事件开关：打包时传 -PtestEvents=true 开启（默认关闭）。
def enableTestEvents = (project.findProperty("testEvents") ?: "false").toString().toBoolean()

// 版本号：打包时传 -PversionName=1.0.1（固定 X.Y.Z 格式）。
// versionCode 定宽换算：major*10000 + minor*100 + patch，各段 0-99（如 2.0.2 → 20002，2.0.10 → 20010）。
// 定宽保证各段两位数以内永远单调递增；新算法产出（major≥1 时 ≥10000）恒大于旧「去点拼接」算法（≤999），
// 对所有商店都是版本升高，切换安全。注意不可回退：商店一旦收到定宽 code，旧算法追不上。
def appVersionName = (project.findProperty("versionName") ?: "1.0.3").toString().trim()
if (!(appVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("versionName 必须为 X.Y.Z 格式（如 1.0.1），当前: '${appVersionName}'")
}
def versionParts = appVersionName.tokenize('.').collect { it.toInteger() }
if (versionParts.any { it > 99 }) {
    throw new GradleException("versionName 各段须为 0-99（当前: '${appVersionName}'）")
}
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

android {
    namespace 'com.hybrid.android'
    compileSdk 36

    defaultConfig {
        applicationId "com.hybrid.android"
        minSdk 29
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a' // 只支持这两个架构
        }
        // 所有渠道共用的配置
        buildConfigField "String", "AF_DEV_KEY", "\"fXoKsKQwxPCRdhD8CD8q6F\""
        buildConfigField "boolean", "ENABLE_TEST_EVENTS", "${enableTestEvents}"
        // Adjust 兜底默认（未绑定渠道保持这两个值）：保证字段对所有 flavor 都存在、编译安全；
        // 上面的 adjust-tokens.json 旁路块会在变体级覆盖（变体级 buildConfigField 优先于默认级）。
        buildConfigField "String", "ADJUST_APP_TOKEN", "\"\""
        buildConfigField "String", "ADJUST_EVENT_MAP", "\"{}\""
    }

    flavorDimensions "channel"
    productFlavors {
        allChannels.each { ch ->
            def cfg = brandConfig[ch.brand]
            create(ch.name) {
                dimension "channel"
                applicationId ch.appId
                resValue "string", "app_name", ch.appName
                buildConfigField "String", "BRAND", "\"${ch.brand}\""
                buildConfigField "String", "DOMAIN", "\"${cfg.domain}\""
                buildConfigField "String", "DEEPLINK_SCHEME", "\"${cfg.scheme}\""
                buildConfigField "String", "PAL_CODE", "\"${ch.pal}\""
                manifestPlaceholders = [deeplinkScheme: cfg.scheme]
            }
        }
    }

    // 小渠道资源按大渠道分目录存放：src/channels/<brand>/<flavor>/{res,assets}
    // assets 承载 CLI 按渠道渲染的 bootstrap.json（域名兜底 + configUrl）；不映射则 APK 只会
    // 用 src/main 的通用默认 bootstrap（brand=ap、错误的首启兜底域名）。目录不存在时 Gradle 忽略，
    // 该 flavor 自然回落 src/main/assets/bootstrap.json。
    sourceSets {
        allChannels.each { ch ->
            getByName(ch.name) {
                res.srcDirs = ["src/channels/${ch.brand}/${ch.name}/res"]
                assets.srcDirs = ["src/channels/${ch.brand}/${ch.name}/assets"]
            }
        }
    }

    // 仅当 local.properties 配齐 keystore 时才装配 release 签名；否则留空（评审 A4：
    // 避免 file(null) 在配置期 NPE，连带把 assembleDebug 也搞挂）。构建机镜像已烧入 local.properties。
    def keystoreFile = localProperties.get("KEYSTORE_FILE")?.toString()?.trim()
    def hasKeystore = keystoreFile != null && !keystoreFile.isEmpty()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword localProperties.get("KEYSTORE_PASSWORD")
                keyAlias localProperties.get("KEY_ALIAS")
                keyPassword localProperties.get("KEY_PASSWORD")
                // 应用商店（OPPO/vivo/小米/华为）后台校验签名仍走 v1（解析 META-INF/*.RSA）。
                // minSdk ≥ 24 时 AGP 默认关闭 v1，只出 v2，会被商店判「签名无效」，这里显式打开 v1+v2。
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("未配置 KEYSTORE_FILE：release 将不签名（仅适用于无密钥环境的冒烟编译）。")
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    // 单测在纯 JVM 跑：用 Robolectric 提供真实 org.json / android.util.Log（替代会抛异常的桩）。
    // includeAndroidResources 让 Robolectric 能加载合并后的资源/清单（DomainResolver 单测虽不读资源，
    // 但开启后 Robolectric 运行更稳，且为后续可能读 assets/资源的测试留好基建）。
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// firebase-common 传递引入 kotlinx-coroutines-play-services（最低需要 1.6.4），
// 但 kotlinx-coroutines BOM 1.8.1 会把它强制升为 1.8.1，而该版本的 jar 在本地 Gradle
// 缓存中不存在且 Maven Central 当前返回 403。
// 强制升至已缓存的 1.9.0（兼容同主版本，仅 Firebase 内部用；我们的协程代码不直接依赖此库）。
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.fragment.ktx

    implementation libs.webview.interceptor
    implementation libs.af.android.sdk
    implementation libs.gms.play.services.ads.identifier
    implementation libs.play.services.appset
    implementation libs.filament.android

    // 域名容灾（DomainResolver）：协程做 STEP1 拉取 / STEP2 并发探测；OkHttp 做网络与证书校验
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.okhttp

    // Firebase 推送（FCM）：依赖无条件加入（编译期始终在 classpath）；
    // 运行时通过 PushBootstrap 探测 FirebaseApp.getApps() 来 no-op（无 google-services.json 时）。
    // BOM 统一管理 Firebase 全家桶版本，firebase-messaging-ktx 不需要单独写版本号。
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    // Adjust 归因（ADR-0013）：依赖无条件加入（同 firebase-messaging），运行时由 AdjustBootstrap
    // 探测 BuildConfig.ADJUST_APP_TOKEN 是否为空来 no-op（未在 adjust-tokens.json 绑定的 flavor）。
    // installreferrer 提供 Play 安装来源归因；GAID 复用已有的 gms.play.services.ads.identifier。
    implementation libs.adjust.android
    implementation libs.installreferrer
    // Adjust 华为设备插件：同 adjust-android 一样无条件入 classpath（薄壳，各十几 KB），
    // 非华为设备上内部探测不到 HMS / AppGallery 即自然 no-op。这样 AdjustBootstrap 可以直接
    // 引用 AdjustOaid 而不必按 flavor 分叉出编译不过的共享代码（同 ADR-0013 对 Adjust 主 SDK 的取舍）。
    implementation libs.adjust.oaid
    implementation libs.adjust.huawei.referrer

    // OAID 采集（AppsFlyer）：华为设备无 GMS → 拿不到 GAID，AppsFlyer 将没有任何广告标识，
    // 事件即使发出去也无法归因（表现为后台「事件丢了」）。两类包需要：
    //   1) 品牌本身要（BP，存量语义不变）；
    //   2) 华为商店包（flavor 以 _hw 结尾 → applicationId 以 .hw 结尾）。商店维度是跨品牌的
    //      （ADR-0009 商店后缀），AP/GP 同样会有华为包，故不能只按品牌开关。
    // com.appsflyer:oaid 体积较大（内含 MSA 移动安全联盟 SDK），仍按 flavor 注入、不全量铺开；
    // 对应的 keep 规则见 proguard-rules.pro 的 OAID 段。
    allChannels.findAll { brandConfig[it.brand].hms || it.name.endsWith("_hw") }.each { ch ->
        add("${ch.name}Implementation", libs.af.oaid)
        add("${ch.name}Implementation", libs.hms.ads.identifier)
    }

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.okhttp.mockwebserver
    // Robolectric：在纯 JVM 单测中提供真实 org.json / android.util.Log 实现（解决桩 NPE / not-mocked）。
    testImplementation libs.robolectric
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

}
